<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Payroll Upload Portal</title>
  
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .admin-card {
      background: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 550px;
    }
    h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 22px;
      margin-bottom: 6px;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .dropzone {
      border: 2px dashed #cbd5e1;
      padding: 30px 20px;
      border-radius: 8px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }
    .dropzone:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    input[type="file"] {
      display: none;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #1d4ed8;
    }
    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    #statusBox {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      display: none;
      line-height: 1.4;
    }
    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-error { background: #fee2e2; color: #b91c1c; }
  </style>

  <!-- SheetJS Library for Parsing Excel Files directly in Browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="admin-card">
    <h2>Payroll Admin Uploader</h2>
    <p>Upload Excel files (~5,000 employees). Files are parsed into lightweight JSON in your browser to avoid payload limit errors.</p>

    <div class="form-group">
      <label for="cutoffPeriod">Cutoff Period / Identifier:</label>
      <input type="text" id="cutoffPeriod" placeholder="e.g., Aug 01-15 2026">
    </div>

    <div class="dropzone" onclick="document.getElementById('excelFile').click()">
      <strong id="fileLabel">📁 Click to Select Excel File (.xlsx)</strong>
      <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="updateFileLabel()">
    </div>

    <button id="uploadBtn" class="btn-submit" onclick="processAndUploadExcel()">PROCESS & UPLOAD PAYSLIPS</button>

    <div id="statusBox"></div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAUipD5NKYj61dEfM1PoyQ2UxVwQ17W24k",
      authDomain: "payslip-portal-328ef.firebaseapp.com",
      projectId: "payslip-portal-328ef",
      storageBucket: "payslip-portal-328ef.firebasestorage.app",
      messagingSenderId: "552626296645",
      appId: "1:552626296645:web:4810a048e188512927d02c",
      measurementId: "G-D8SZDV2CTP"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function updateFileLabel() {
      const input = document.getElementById('excelFile');
      if (input.files.length > 0) {
        document.getElementById('fileLabel').innerText = "📄 Selected: " + input.files[0].name;
      }
    }

    function showStatus(text, type) {
      const statusBox = document.getElementById('statusBox');
      statusBox.style.display = 'block';
      statusBox.className = 'status-' + type;
      statusBox.innerText = text;
    }

    async function processAndUploadExcel() {
      const fileInput = document.getElementById('excelFile');
      const cutoffInput = document.getElementById('cutoffPeriod');
      const uploadBtn = document.getElementById('uploadBtn');

      if (!fileInput.files.length) {
        showStatus("Please select an Excel file first.", "error");
        return;
      }

      const file = fileInput.files[0];
      const cutoff = cutoffInput.value.trim() || "default_cutoff";

      uploadBtn.disabled = true;
      showStatus("Reading Excel file in browser...", "info");

      const reader = new FileReader();

      reader.onload = async function (e) {
        try {
          showStatus("Parsing sheet into JSON...", "info");
          
          // Read binary buffer
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          // Get first sheet
          const sheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[sheetName];

          // Convert sheet to JSON array
          const rawRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

          if (!rawRows || rawRows.length === 0) {
            showStatus("No data rows found in the Excel sheet.", "error");
            uploadBtn.disabled = false;
            return;
          }

          showStatus(`Extracted ${rawRows.length.toLocaleString()} rows. Formatting records...`, "info");

          const cleanedPayslips = [];
          
          rawRows.forEach((row) => {
            // Flexible detection for Employee ID header column
            const empIdRaw = row.empId || row["EMPLOYEE ID"] || row["ID NUMBER"] || row["EMP ID"] || row["Employee ID"] || row["ID"] || row["F"] || row["__EMPTY"];
            
            if (empIdRaw) {
              const cleanId = String(empIdRaw).replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
              if (cleanId.length > 0) {
                cleanedPayslips.push({
                  ...row,
                  empId: cleanId,
                  cutoffPeriod: cutoff,
                  uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
            }
          });

          if (cleanedPayslips.length === 0) {
            showStatus("Could not locate valid Employee IDs. Check sheet headers.", "error");
            uploadBtn.disabled = false;
            return;
          }

          showStatus(`Uploading ${cleanedPayslips.length.toLocaleString()} records...`, "info");

          // Batch Upload to Firestore in Chunks of 400
          const CHUNK_SIZE = 400;
          let uploadedCount = 0;
          const totalBatches = Math.ceil(cleanedPayslips.length / CHUNK_SIZE);
          const cutoffSlug = cutoff.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();

          for (let i = 0; i < cleanedPayslips.length; i += CHUNK_SIZE) {
            const chunk = cleanedPayslips.slice(i, i + CHUNK_SIZE);
            const batch = db.batch();

            chunk.forEach(payslip => {
              // Custom Doc ID prevents creation of duplicate rows if re-uploaded
              const customDocId = `${payslip.empId}_${cutoffSlug}`;
              const docRef = db.collection("payslips").doc(customDocId);
              
              batch.set(docRef, payslip, { merge: true });
            });

            await batch.commit();
            uploadedCount += chunk.length;

            const currentBatch = Math.ceil(uploadedCount / CHUNK_SIZE);
            showStatus(`Uploading Batch ${currentBatch} of ${totalBatches}... (${uploadedCount.toLocaleString()} / ${cleanedPayslips.length.toLocaleString()} uploaded)`, "info");
          }

          showStatus(`🎉 SUCCESS! All ${cleanedPayslips.length.toLocaleString()} employee payslips uploaded successfully.`, "success");
          fileInput.value = "";
          document.getElementById('fileLabel').innerText = "📁 Click to Select Excel File (.xlsx)";

        } catch (error) {
          console.error("Upload error:", error);
          showStatus("Error: " + error.message, "error");
        } finally {
          uploadBtn.disabled = false;
        }
      };

      // Read file into browser memory as ArrayBuffer (no base64 overhead)
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
