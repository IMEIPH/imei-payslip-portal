<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Payslip Portal</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f7fafc; padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 550px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

    /* LOGIN FORM */
    #loginBox { max-width: 380px; margin: 40px auto; text-align: center; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { font-size: 13px; font-weight: bold; color: #4a5568; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; }
    button { width: 100%; padding: 11px; background: #2b6cb0; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #2c5282; }

    /* PAYSLIP DISPLAY */
    #payslipContainer { display: none; }
    .header-box { text-align: center; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-bottom: 15px; }
    .emp-info { background: #f7fafc; padding: 10px 12px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; color: #2d3748; }

    .section-title { background: #ebf8ff; color: #2b6cb0; font-size: 12px; font-weight: bold; padding: 8px 10px; border-radius: 4px; letter-spacing: 0.5px; margin-top: 15px; margin-bottom: 8px; text-transform: uppercase; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: #718096; font-size: 11px; border-bottom: 1px solid #e2e8f0; padding: 6px 4px; text-transform: uppercase; }
    td { padding: 7px 4px; border-bottom: 1px dashed #edf2f7; color: #2d3748; }
    
    .text-right { text-align: right; }
    .font-bold { font-weight: bold; }
    .gross-row td { background: #ebf8ff; color: #2b6cb0; font-weight: bold; font-size: 14px; }

    .btn-logout { background: #a0aec0; margin-top: 20px; }
    .btn-logout:hover { background: #718096; }
  </style>

  <!-- FIREBASE LIBRARIES -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- LOGIN CONTAINER -->
  <div id="loginBox" class="container">
    <h2 style="margin-top: 0;">PAYSLIP PORTAL</h2>
    <div class="input-group">
      <label>EMPLOYEE ID</label>
      <input type="text" id="empIdInput" placeholder="Enter Employee ID">
    </div>
    <div class="input-group">
      <label>PIN CODE</label>
      <input type="password" id="pinInput" placeholder="Enter 6-digit PIN" maxlength="6">
    </div>
    <button onclick="viewPayslip()">VIEW PAYSLIP</button>
    <div id="loginError" style="color: red; font-size: 13px; font-weight: bold; margin-top: 10px;"></div>
  </div>

  <!-- PAYSLIP DISPLAY CONTAINER -->
  <div id="payslipContainer" class="container">
    <div class="header-box">
      <h3 style="margin: 0; color: #2d3748;">EMPLOYEE PAYSLIP</h3>
    </div>

    <div class="emp-info">
      <div><strong>EMPLOYEE ID:</strong> <span id="dispEmpId">-</span></div>
      <div><strong>NAME:</strong> <span id="dispEmpName">-</span></div>
    </div>

    <!-- EARNINGS & HOURS TABLE -->
    <div class="section-title">EARNINGS & HOURS</div>
    <table>
      <thead>
        <tr>
          <th>TYPE</th>
          <th class="text-right">HOURS / DAYS</th>
          <th class="text-right">AMOUNT</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>REGULAR DAYS</td>
          <td class="text-right" id="valRegDays">-</td>
          <td class="text-right font-bold" id="valRegDaysAmt">-</td>
        </tr>
        <tr>
          <td>REGULAR OT</td>
          <td class="text-right" id="valRegOtHours">-</td>
          <td class="text-right font-bold" id="valRegOtAmt">-</td>
        </tr>
        <!-- RENAMED TO NIGHT PREMIUM -->
        <tr>
          <td>NIGHT PREMIUM</td>
          <td class="text-right" id="valNightDiffHours">-</td>
          <td class="text-right font-bold" id="valNightDiffAmt">-</td>
        </tr>
        <tr>
          <td>REGULAR OT NP</td>
          <td class="text-right" id="valRegOtNpHours">-</td>
          <td class="text-right font-bold" id="valRegOtNpAmt">-</td>
        </tr>
        <tr>
          <td>LEAVE WITH PAY</td>
          <td class="text-right" id="valLeaveDays">-</td>
          <td class="text-right font-bold" id="valLeaveAmt">-</td>
        </tr>
        <tr class="gross-row">
          <td>GROSS PAY</td>
          <td></td>
          <td class="text-right" id="valGrossPay">-</td>
        </tr>
      </tbody>
    </table>

    <button class="btn-logout" onclick="logoutEmployee()">LOGOUT / BACK</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAUipD5NKYj61dEfM1PoyQ2UxVwQ17W24k",
      authDomain: "payslip-portal-328ef.firebaseapp.com",
      projectId: "payslip-portal-328ef",
      storageBucket: "payslip-portal-328ef.firebasestorage.app",
      messagingSenderId: "552626296645",
      appId: "1:552626296645:web:4810a048e188512927d02c",
      measurementId: "G-D8SZDV2CTP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function formatMoney(num) {
      if (!num || isNaN(num) || num === 0) return "-";
      return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatQty(num) {
      if (!num || isNaN(num) || num === 0) return "-";
      return Number(num).toFixed(2);
    }

    async function viewPayslip() {
      const empId = document.getElementById("empIdInput").value.trim().toUpperCase();
      const pin = document.getElementById("pinInput").value.trim();
      const err = document.getElementById("loginError");
      err.innerText = "";

      if (!empId || !pin) {
        err.innerText = "Please enter Employee ID and PIN.";
        return;
      }

      try {
        // 1. Verify PIN
        const empDoc = await db.collection("employees").doc(empId).get();
        if (!empDoc.exists) {
          err.innerText = "Employee ID not found.";
          return;
        }

        const empData = empDoc.data();
        if (String(empData.pin).trim() !== pin) {
          err.innerText = "Incorrect PIN code.";
          return;
        }

        // 2. Load Payslip Data
        const payslipDoc = await db.collection("payslips").doc(empId).get();
        if (!payslipDoc.exists) {
          err.innerText = "No payslip record found for this period.";
          return;
        }

        const data = payslipDoc.data();

        // Populate Metadata
        document.getElementById("dispEmpId").innerText = empId;
        document.getElementById("dispEmpName").innerText = data.empName || "N/A";

        // Populate Table Data (Column AS -> regularDaysAmount)
        document.getElementById("valRegDays").innerText = formatQty(data.regularDays);
        document.getElementById("valRegDaysAmt").innerText = formatMoney(data.regularDaysAmount);

        document.getElementById("valRegOtHours").innerText = formatQty(data.regularOtHours);
        document.getElementById("valRegOtAmt").innerText = formatMoney(data.regularOtAmount);

        document.getElementById("valNightDiffHours").innerText = formatQty(data.nightDiffHours);
        document.getElementById("valNightDiffAmt").innerText = formatMoney(data.nightDiffAmount);

        document.getElementById("valRegOtNpHours").innerText = formatQty(data.regularOtNpHours);
        document.getElementById("valRegOtNpAmt").innerText = formatMoney(data.regularOtNpAmount);

        document.getElementById("valLeaveDays").innerText = formatQty(data.leaveWithPayDays);
        document.getElementById("valLeaveAmt").innerText = formatMoney(data.leaveWithPayAmount);

        document.getElementById("valGrossPay").innerText = formatMoney(data.grossPay);

        // Switch Screen
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("payslipContainer").style.display = "block";

      } catch (e) {
        console.error(e);
        err.innerText = "Error loading payslip: " + e.message;
      }
    }

    function logoutEmployee() {
      document.getElementById("payslipContainer").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("pinInput").value = "";
    }
  </script>
</body>
</html>
