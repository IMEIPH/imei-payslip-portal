<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payroll Excel Uploader</title>
  
  <!-- 1. SheetJS Library (Required for parsing Excel in browser) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .upload-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
    }
    .dropzone {
      border: 2px dashed #cbd5e1;
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      background: #f1f5f9;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .dropzone:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    input[type="file"] {
      display: none;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }
    .info { color: #0284c7; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>
<body>

  <div class="upload-card">
    <h2>Payroll Data Upload</h2>
    <p style="color: #64748b; font-size: 14px;">Select your payroll Excel file (~5,000 employees supported).</p>

    <!-- Upload Dropzone -->
    <div class="dropzone" onclick="document.getElementById('excelFile').click()">
      <span id="fileLabel">📁 Click to choose Excel file (.xlsx)</span>
      <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="updateLabel()">
    </div>

    <button id="uploadBtn" class="btn-submit" onclick="processAndUpload()">Upload Payroll</button>

    <div id="status"></div>
  </div>

  <script>
    function updateLabel() {
      const input = document.getElementById('excelFile');
      if (input.files.length > 0) {
        document.getElementById('fileLabel').innerText = "📄 " + input.files[0].name;
      }
    }

    function showStatus(message, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.className = type;
      statusDiv.innerText = message;
    }

    async function processAndUpload() {
      const fileInput = document.getElementById('excelFile');
      const uploadBtn = document.getElementById('uploadBtn');

      if (!fileInput.files.length) {
        showStatus("Please select an Excel file first.", "error");
        return;
      }

      const file = fileInput.files[0];
      uploadBtn.disabled = true;
      showStatus("Reading file in browser...", "info");

      const reader = new FileReader();

      reader.onload = async function(e) {
        try {
          showStatus("Parsing Excel sheet to JSON...", "info");

          // Parse binary Excel buffer
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          // Extract first sheet rows into JSON array
          const firstSheet = workbook.SheetNames[0];
          const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet], { defval: "" });

          if (!rawRows || rawRows.length === 0) {
            showStatus("No rows found in the selected Excel file.", "error");
            uploadBtn.disabled = false;
            return;
          }

          showStatus(`Extracted ${rawRows.length} rows. Uploading in chunks...`, "info");

          // CHUNKING LOGIC: Send 1,000 rows at a time to avoid 1MB Apps Script payload limits
          const CHUNK_SIZE = 1000;
          const totalBatches = Math.ceil(rawRows.length / CHUNK_SIZE);

          for (let i = 0; i < rawRows.length; i += CHUNK_SIZE) {
            const chunk = rawRows.slice(i, i + CHUNK_SIZE);
            const isFirstChunk = (i === 0);
            const batchNum = Math.ceil((i + 1) / CHUNK_SIZE);

            showStatus(`Uploading Batch ${batchNum} of ${totalBatches} (${chunk.length} rows)...`, "info");

            // Call Google Apps Script backend function
            await new Promise((resolve, reject) => {
              google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler((err) => reject(err))
                .processPayrollJSON(chunk, isFirstChunk);
            });
          }

          showStatus(`🎉 Success! All ${rawRows.length} employees uploaded successfully.`, "success");
          fileInput.value = "";
          document.getElementById('fileLabel').innerText = "📁 Click to choose Excel file (.xlsx)";

        } catch (err) {
          console.error(err);
          showStatus("Error: " + err.message, "error");
        } finally {
          uploadBtn.disabled = false;
        }
      };

      // Read as ArrayBuffer for SheetJS
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
