<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Payslip Upload & Sync Portal</title>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    }
    body { 
      background-color: #f1f5f9; 
      margin: 0;
      padding: 40px 20px; 
      display: flex; 
      justify-content: center; 
      align-items: flex-start;
      min-height: 100vh;
    }
    .container { 
      width: 100%; 
      max-width: 700px; 
      background: #ffffff; 
      padding: 30px; 
      border-radius: 10px; 
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); 
    }
    h2 { 
      margin-top: 0; 
      color: #1e293b; 
      font-size: 22px; 
      text-transform: uppercase; 
      border-bottom: 2px solid #e2e8f0; 
      padding-bottom: 12px; 
    }
    .input-group { 
      margin-bottom: 20px; 
    }
    label { 
      font-weight: 700; 
      display: block; 
      margin-bottom: 8px; 
      color: #475569; 
      font-size: 13px; 
      text-transform: uppercase; 
    }
    input[type="file"], input[type="text"], select { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #cbd5e1; 
      border-radius: 6px; 
      font-size: 14px; 
      background: #fff; 
      color: #1e293b;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .row-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .btn-sync { 
      width: 100%; 
      padding: 14px; 
      background: #2563eb; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
      text-transform: uppercase;
      transition: background 0.2s;
    }
    .btn-sync:hover { 
      background: #1d4ed8; 
    }
    #logBox { 
      margin-top: 20px; 
      background: #0f172a; 
      color: #38ef7d; 
      padding: 15px; 
      border-radius: 6px; 
      font-family: monospace; 
      font-size: 13px; 
      max-height: 250px; 
      overflow-y: auto; 
      display: none; 
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- SheetJS Library for Excel Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <div class="container">
    <h2>Admin Payslip Excel Sync</h2>

    <div class="input-group">
      <label>Select Payroll Excel File (.xlsx)</label>
      <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <div class="row-grid">
      <div class="input-group">
        <label>Company Name</label>
        <input type="text" id="companyName" value="INT'L. MANPOWER ESSENTIALS, INC.">
      </div>
      <div class="input-group">
        <label>Client Name</label>
        <input type="text" id="clientName" value="TECEDIA CEBU INC.">
      </div>
    </div>

    <div class="row-grid">
      <div class="input-group">
        <label>Payroll Date</label>
        <input type="text" id="payrollDate" value="JULY 15, 2026">
      </div>
      <div class="input-group">
        <label>Payroll Period</label>
        <input type="text" id="payrollPeriod" value="JUNE 26, 2026 - JULY 10, 2026">
      </div>
    </div>

    <div class="input-group">
      <label>Starting Excel Row (e.g. 8)</label>
      <input type="number" id="startRow" value="8" min="1">
    </div>

    <button class="btn-sync" onclick="processAndUploadExcel()">PROCESS AND UPLOAD TO FIREBASE</button>

    <div id="logBox"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAUipD5NKYj61dEfM1PoyQ2UxVwQ17W24k",
      authDomain: "payslip-portal-328ef.firebaseapp.com",
      projectId: "payslip-portal-328ef",
      storageBucket: "payslip-portal-328ef.firebasestorage.app",
      messagingSenderId: "552626296645",
      appId: "1:552626296645:web:4810a048e188512927d02c",
      measurementId: "G-D8SZDV2CTP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function logMessage(msg) {
      const box = document.getElementById("logBox");
      box.style.display = "block";
      box.innerHTML += `> ${msg}<br>`;
      box.scrollTop = box.scrollHeight;
    }

    function getVal(sheet, cellAddress) {
      const cell = sheet[cellAddress];
      return cell ? cell.v : 0;
    }

    async function processAndUploadExcel() {
      const fileInput = document.getElementById("excelFile");
      const logBox = document.getElementById("logBox");
      logBox.innerHTML = "";

      if (fileInput.files.length === 0) {
        alert("Please select an Excel file first.");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      const company = document.getElementById("companyName").value;
      const client = document.getElementById("clientName").value;
      const payrollDate = document.getElementById("payrollDate").value;
      const payrollPeriod = document.getElementById("payrollPeriod").value;
      const startRow = parseInt(document.getElementById("startRow").value) || 8;

      reader.onload = async function(e) {
        try {
          logMessage("Reading Excel file...");
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          // Use the first worksheet or Sheet2 based on your reference
          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];

          logMessage(`Processing worksheet: ${sheetName}`);

          let currentRow = startRow;
          let successCount = 0;

          while (true) {
            const idCell = getVal(sheet, `F${currentRow}`);
            const nameCell = getVal(sheet, `G${currentRow}`);

            // Stop condition if ID cell is empty
            if (!idCell || String(idCell).trim() === "") {
              break;
            }

            const empId = String(idCell).trim().replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            const empName = String(nameCell).trim();

            logMessage(`Reading Row ${currentRow} -> ID: ${empId}, Name: ${empName}`);

            // Build the exact comprehensive row mapping matching your index template
            const payslipData = {
              empId: empId,
              empName: empName,
              company: company,
              client: client,
              payrollDate: payrollDate,
              payrollPeriod: payrollPeriod,

              // --- EARNINGS & HOURS ---
              AQ: getVal(sheet, `AQ${currentRow}`),
              AR: getVal(sheet, `AR${currentRow}`),
              AS: getVal(sheet, `AS${currentRow}`),
              AV: getVal(sheet, `AV${currentRow}`),
              AW: getVal(sheet, `AW${currentRow}`),
              AZ: getVal(sheet, `AZ${currentRow}`),
              BA: getVal(sheet, `BA${currentRow}`),
              BB: getVal(sheet, `BB${currentRow}`),
              BC: getVal(sheet, `BC${currentRow}`),
              BD: getVal(sheet, `BD${currentRow}`),
              BE: getVal(sheet, `BE${currentRow}`),
              BF: getVal(sheet, `BF${currentRow}`),
              BG: getVal(sheet, `BG${currentRow}`),
              BH: getVal(sheet, `BH${currentRow}`),
              BI: getVal(sheet, `BI${currentRow}`),
              BJ: getVal(sheet, `BJ${currentRow}`),
              BK: getVal(sheet, `BK${currentRow}`),
              BL: getVal(sheet, `BL${currentRow}`),
              BM: getVal(sheet, `BM${currentRow}`),
              BN: getVal(sheet, `BN${currentRow}`),
              BO: getVal(sheet, `BO${currentRow}`),
              BP: getVal(sheet, `BP${currentRow}`),
              BQ: getVal(sheet, `BQ${currentRow}`),
              BR: getVal(sheet, `BR${currentRow}`),
              BS: getVal(sheet, `BS${currentRow}`),
              BV: getVal(sheet, `BV${currentRow}`),
              BW: getVal(sheet, `BW${currentRow}`),
              BX: getVal(sheet, `BX${currentRow}`),
              BY: getVal(sheet, `BY${currentRow}`),
              BZ: getVal(sheet, `BZ${currentRow}`),
              CA: getVal(sheet, `CA${currentRow}`),
              CB: getVal(sheet, `CB${currentRow}`),
              CC: getVal(sheet, `CC${currentRow}`),
              CT: getVal(sheet, `CT${currentRow}`),
              CU: getVal(sheet, `CU${currentRow}`),
              CX: getVal(sheet, `CX${currentRow}`), // Gross Pay

              // --- DEDUCTIONS ---
              DA: getVal(sheet, `DA${currentRow}`),
              DB: getVal(sheet, `DB${currentRow}`),
              DC: getVal(sheet, `DC${currentRow}`),
              DD: getVal(sheet, `DD${currentRow}`),
              DE: getVal(sheet, `DE${currentRow}`),
              DF: getVal(sheet, `DF${currentRow}`),
              DG: getVal(sheet, `DG${currentRow}`),
              DR: getVal(sheet, `DR${currentRow}`),
              DH: getVal(sheet, `DH${currentRow}`),
              DI: getVal(sheet, `DI${currentRow}`),
              DJ: getVal(sheet, `DJ${currentRow}`),
              DK: getVal(sheet, `DK${currentRow}`),
              DO: getVal(sheet, `DO${currentRow}`), // Total Deductions

              // --- ADJUSTMENTS & NET PAY ---
              DP: getVal(sheet, `DP${currentRow}`),
              DQ: getVal(sheet, `DQ${currentRow}`),
              DT: getVal(sheet, `DT${currentRow}`),
              DV: getVal(sheet, `DV${currentRow}`), // Net Pay

              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            // Create a unique document ID per employee and payroll date
            const docId = `${empId}_${payrollDate.replace(/[^a-zA-Z0-9]/g, '_')}`;
            
            // Save to Firestore payslips collection
            await db.collection("payslips").doc(docId).set(payslipData, { merge: true });
            
            // Also ensure ID is in whitelist collection for registration checks
            await db.collection("whitelist").doc(empId).set({
              empId: empId,
              name: empName,
              active: true
            }, { merge: true });

            successCount++;
            currentRow++;
          }

          logMessage(`SUCCESS: Uploaded ${successCount} employee payslips to Firebase!`);
        } catch (err) {
          console.error(err);
          logMessage(`ERROR: ${err.message}`);
        }
      };

      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
