<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAUipD5NKYj61dEfM1PoyQ2UxVwQ17W24k",
    authDomain: "payslip-portal-328ef.firebaseapp.com",
    projectId: "payslip-portal-328ef",
    storageBucket: "payslip-portal-328ef.firebasestorage.app",
    messagingSenderId: "552626296645",
    appId: "1:552626296645:web:4810a048e188512927d02c",
    measurementId: "G-D8SZDV2CTP"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  async function handleEmployeeLogin() {
    // Clean and ignore extra spaces from inputs
    const empId = document.getElementById("empId").value.trim().toUpperCase();
    const pin = document.getElementById("empPin").value.trim();
    const month = document.getElementById("payMonth").value.trim().toUpperCase();
    const day = document.getElementById("payDay").value.trim();
    const year = document.getElementById("payYear").value.trim();
    
    const errDiv = document.getElementById("loginError");
    errDiv.style.display = "none";

    if (!empId || !pin || !day || !year) {
      errDiv.innerText = "PLEASE FILL IN ALL FIELDS.";
      errDiv.style.display = "block";
      return;
    }

    try {
      // 1. Verify User PIN in admin_users collection (Trimming spaces)
      const userDoc = await db.collection("admin_users").doc(empId).get();
      
      if (!userDoc.exists || userDoc.data().pin.trim() !== pin) {
        errDiv.innerText = "INVALID EMPLOYEE ID OR PIN.";
        errDiv.style.display = "block";
        return;
      }

      // 2. Format payroll date string to match uploaded record format
      // Constructs "JULY 15, 2026" (or adjust format to match cell A3)
      const formattedDate = `${month} ${day}, ${year}`.trim();

      // 3. Search payslips for matching Emp ID (Trimming spaces)
      const payslipQuery = await db.collection("payslips")
        .where("empId", "==", empId)
        .where("payrollDate", "==", formattedDate)
        .get();

      if (payslipQuery.empty) {
        errDiv.innerText = `NO PAYSLIP FOUND FOR ${formattedDate}.`;
        errDiv.style.display = "block";
        return;
      }

      // Record found! Display payslip
      const payslipData = payslipQuery.docs[0].data();
      renderPayslip(payslipData);

    } catch (error) {
      errDiv.innerText = "ERROR LOADING PAYSLIP. PLEASE TRY AGAIN.";
      errDiv.style.display = "block";
    }
  }

  function renderPayslip(data) {
    // Logic to render the employee payslip...
    alert(`Welcome ${data.empName}! Net Pay: ${data.netPay}`);
  }
</script>
