<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Payslip</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f7fafc; padding: 20px; display: flex; justify-content: center; }
    .payslip-card { width: 100%; max-width: 480px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; }
    
    table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    td { padding: 6px 4px; font-size: 12px; font-weight: 600; color: #2d3748; border-bottom: 1px solid #edf2f7; }
    td.col-label { text-align: left; text-transform: uppercase; }
    td.col-qty { text-align: center; color: #4a5568; width: 60px; }
    td.col-amount { text-align: right; font-weight: 700; width: 90px; }
    
    .section-header { background: #edf2f7; padding: 8px; font-weight: 800; font-size: 11px; color: #2b6cb0; text-transform: uppercase; border-radius: 4px; margin: 15px 0 8px 0; }
    .table-sub-header td { font-size: 10px; color: #718096; text-transform: uppercase; border-bottom: 2px solid #cbd5e0; padding-bottom: 4px; }
    
    .highlight-gross { background: #ebf8ff; color: #2b6cb0; }
    .highlight-gross td { font-weight: 800; font-size: 13px; }

    .highlight-deductions { background: #ebf8ff; color: #2b6cb0; }
    .highlight-deductions td { font-weight: 800; font-size: 13px; }

    .highlight-net { background: #c6f6d5; color: #22543d; }
    .highlight-net td { font-weight: 800; font-size: 14px; }
  </style>
</head>
<body>

  <div class="payslip-card">
    
    <!-- EARNINGS TABLE -->
    <table>
      <tbody id="earningsBody">
        <!-- Dynamically rendered according to exact sequence -->
      </tbody>
    </table>

    <!-- DEDUCTIONS SECTION -->
    <div class="section-header">DEDUCTIONS</div>
    <table>
      <thead>
        <tr class="table-sub-header">
          <td class="col-label">DEDUCTION ITEM</td>
          <td class="col-amount">AMOUNT</td>
        </tr>
      </thead>
      <tbody id="deductionsBody">
        <!-- Dynamically rendered according to exact sequence -->
      </tbody>
    </table>

    <!-- ADJUSTMENTS & NET TAKE HOME SECTION -->
    <div class="section-header">ADJUSTMENTS & NET TAKE HOME</div>
    <table>
      <tbody id="adjustmentsBody">
        <!-- Dynamically rendered according to exact sequence -->
      </tbody>
    </table>

  </div>

  <script>
    // Helper formatters
    function fmtAmt(val) {
      const num = parseFloat(val) || 0;
      return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtQty(val) {
      const num = parseFloat(val) || 0;
      return num === 0 ? "-" : num.toFixed(2).replace(/\.00$/, '');
    }

    function renderPayslip(data) {
      // 1. EARNINGS SEQUENCE
      const earnings = [
        { label: "REGULAR DAYS", qty: data.regularDays, amt: data.regularDaysAmount },
        { label: "REG OT", qty: data.regularOtHours, amt: data.regularOtAmount },
        { label: "NP", qty: data.nightDiffHours, amt: data.nightDiffAmount },
        { label: "REG OT NP", qty: data.regularOtNpHours, amt: data.regularOtNpAmount },
        { label: "REGULAR HOLIDAY PAY", qty: data.regHolidayPayQty, amt: data.regHolidayPayAmount },
        { label: "REGULAR HOLIDAY DUTY", qty: data.regHolidayDutyQty, amt: data.regHolidayDutyAmount },
        { label: "REGULAR HOLIDAY OT", qty: data.regHolidayOtQty, amt: data.regHolidayOtAmount },
        { label: "REGULAR HOLIDAY NP", qty: data.regHolidayNpQty, amt: data.regHolidayNpAmount },
        { label: "SPECIAL HOLIDAY DUTY", qty: data.specHolidayDutyQty, amt: data.specHolidayDutyAmount },
        { label: "SPECIAL HOLIDAY OT", qty: data.specHolidayOtQty, amt: data.specHolidayOtAmount },
        { label: "SPECIAL HOLIDAY NP", qty: data.specHolidayNpQty, amt: data.specHolidayNpAmount },
        { label: "SPECIAL HOLIDAY OT NP", qty: data.specHolidayOtNpQty, amt: data.specHolidayOtNpAmount },
        { label: "REST DAY", qty: data.restDayQty, amt: data.restDayAmount },
        { label: "REST DAY OT", qty: data.restDayOtQty, amt: data.restDayOtAmount },
        { label: "REST DAY NP", qty: data.restDayNpQty, amt: data.restDayNpAmount },
        { label: "REST DAY NP OT", qty: data.restDayNpOtQty, amt: data.restDayNpOtAmount },
        { label: "LEAVE WITH PAY", qty: data.leaveWithPayQty, amt: data.leaveWithPayAmount }
      ];

      let earningsHtml = "";
      earnings.forEach(item => {
        earningsHtml += `
          <tr>
            <td class="col-label">${item.label}</td>
            <td class="col-qty">${fmtQty(item.qty)}</td>
            <td class="col-amount">${fmtAmt(item.amt)}</td>
          </tr>`;
      });
      earningsHtml += `
        <tr class="highlight-gross">
          <td class="col-label" colspan="2">GROSS PAY</td>
          <td class="col-amount">${fmtAmt(data.grossPay)}</td>
        </tr>`;
      document.getElementById("earningsBody").innerHTML = earningsHtml;

      // 2. DEDUCTIONS SEQUENCE
      const deductions = [
        { label: "WELFARE", amt: data.welfare },
        { label: "HEALTH INSURANCE", amt: data.healthInsurancePremium },
        { label: "INSURANCE CARD", amt: data.insuranceCard },
        { label: "MISC.", amt: data.misc },
        { label: "MEDICAL", amt: data.medical },
        { label: "SALARY LOAN 1", amt: data.salaryLoan1 },
        { label: "SALARY LOAN 2", amt: data.salaryLoan2 },
        { label: "SALARY LOAN 3", amt: data.salaryLoan3 },
        { label: "SSS LOAN", amt: data.sssLoan },
        { label: "SSS CALAMITY LOAN", amt: data.sssCalamityLoan },
        { label: "HDMF LOAN", amt: data.hdmfLoan },
        { label: "HDMF CALAMITY LOAN", amt: data.hdmfCalamityLoan }
      ];

      let deductionsHtml = "";
      deductions.forEach(item => {
        deductionsHtml += `
          <tr>
            <td class="col-label">${item.label}</td>
            <td class="col-amount">${fmtAmt(item.amt)}</td>
          </tr>`;
      });
      deductionsHtml += `
        <tr class="highlight-deductions">
          <td class="col-label">TOTAL DEDUCTIONS</td>
          <td class="col-amount">${fmtAmt(data.totalDeductions)}</td>
        </tr>`;
      document.getElementById("deductionsBody").innerHTML = deductionsHtml;

      // 3. ADJUSTMENTS & NET TAKE HOME SEQUENCE
      const adjustments = [
        { label: "PAYROLL ADJUSTMENT 1", amt: data.payrollAdjustment1 },
        { label: "PAYROLL ADJUSTMENT 2", amt: data.payrollAdjustment2 },
        { label: "REFUND SALARY", amt: data.refundSalary }
      ];

      let adjustmentsHtml = "";
      adjustments.forEach(item => {
        adjustmentsHtml += `
          <tr>
            <td class="col-label">${item.label}</td>
            <td class="col-amount">${fmtAmt(item.amt)}</td>
          </tr>`;
      });
      adjustmentsHtml += `
        <tr class="highlight-net">
          <td class="col-label">NET PAY</td>
          <td class="col-amount">${fmtAmt(data.netPay)}</td>
        </tr>`;
      document.getElementById("adjustmentsBody").innerHTML = adjustmentsHtml;
    }
  </script>
</body>
</html>
