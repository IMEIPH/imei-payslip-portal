<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Admin - Payroll Upload</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; width: 100%; max-width: 550px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1a202c; margin-top: 0; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #4a5568; }
    input[type="file"] { width: 100%; padding: 10px; border: 1px dashed #cbd5e0; border-radius: 6px; background: #faf5ff; }
    button { width: 100%; padding: 12px; background: #38a169; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #2f855a; }
    .status { padding: 12px; border-radius: 6px; margin-top: 15px; display: none; text-align: center; font-weight: bold; line-height: 1.4; }
    .success { background: #f0fff4; color: #276749; border: 1px solid #c6f6d5; }
    .error { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>HR Payroll Secured Upload</h2>
    <div class="form-group">
      <label>Select Payroll Excel Sheet (.xlsx)</label>
      <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>
    <button onclick="processAndUpload()">Validate & Upload to Database</button>
    <div id="statusBox" class="status"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAUipD5NKYj61dEfM1PoyQ2UxVwQ17W24k",
      authDomain: "payslip-portal-328ef.firebaseapp.com",
      projectId: "payslip-portal-328ef",
      storageBucket: "payslip-portal-328ef.firebasestorage.app",
      messagingSenderId: "552626296645",
      appId: "1:552626296645:web:4810a048e188512927d02c",
      measurementId: "G-D8SZDV2CTP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function showStatus(msg, isError = false) {
      const box = document.getElementById("statusBox");
      box.innerText = msg;
      box.className = "status " + (isError ? "error" : "success");
      box.style.display = "block";
    }

    async function processAndUpload() {
      const fileInput = document.getElementById("excelFile");
      if (!fileInput.files.length) {
        showStatus("Please select an Excel file first.", true);
        return;
      }

      showStatus("Validating rules and checking for duplicates...");

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          // Rule 1: Must contain 'PAYROLL' tab
          const payrollTabName = workbook.SheetNames.find(
            name => name.trim().toUpperCase() === "PAYROLL"
          );

          if (!payrollTabName) {
            showStatus("❌ Upload Rejected: Must contain a tab named 'PAYROLL'.", true);
            return;
          }

          const worksheet = workbook.Sheets[payrollTabName];

          // Rule 2: A1, A2, A3, A4 must have data
          const valA1 = worksheet['A1'] ? String(worksheet['A1'].v).trim() : "";
          const valA2 = worksheet['A2'] ? String(worksheet['A2'].v).trim() : "";
          const valA3 = worksheet['A3'] ? String(worksheet['A3'].v).trim() : "";
          const valA4 = worksheet['A4'] ? String(worksheet['A4'].v).trim() : "";

          if (!valA1 || !valA2 || !valA3 || !valA4) {
            showStatus("❌ Upload Rejected: Header cells A1, A2, A3, or A4 are missing.", true);
            return;
          }

          // Rule 3 & 4: Prevent Duplicate Uploads
          const duplicateCheck = await db.collection("uploaded_payrolls")
            .where("payrollDate", "==", valA3)
            .where("payrollPeriod", "==", valA4)
            .get();

          if (!duplicateCheck.empty) {
            showStatus(`❌ Duplicate Upload Rejected: (${valA3} | ${valA4}) was already uploaded!`, true);
            return;
          }

          // Parse rows as raw array to extract exact column positions
          const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: "A", raw: false });

          showStatus("Uploading mapped payslip fields...");

          let count = 0;
          // Row 1 to 5 are headers; data usually starts at Row 6 or 7
          for (let i = 5; i < rawRows.length; i++) {
            const r = rawRows[i];
            
            const empId = String(r['F'] || "").trim().toUpperCase();
            const empName = String(r['G'] || "").trim();

            if (!empId || !empName) continue; // Skip empty rows

            const payslipData = {
              empId: empId,
              empName: empName,
              company: valA1,
              client: valA2,
              payrollDate: valA3,
              payrollPeriod: valA4,
              
              // Earnings / Hours
              regDaysCount: r['AQ'] || "0", regDaysAmt: r['AR'] || "0.00",
              regOtCount: r['AV'] || "0",   regOtAmt: r['AW'] || "0.00",
              npCount: r['AZ'] || "0",      npAmt: r['BA'] || "0.00",
              regOtNpCount: r['BB'] || "0", regOtNpAmt: r['BC'] || "0.00",
              restDayCount: r['BV'] || "0", restDayAmt: r['BW'] || "0.00",
              restDayOtCount: r['BX'] || "0", restDayOtAmt: r['BY'] || "0.00",
              restDayNpCount: r['BZ'] || "0", restDayNpAmt: r['CA'] || "0.00",
              restDayNpOtCount: r['CB'] || "0", restDayNpOtAmt: r['CC'] || "0.00",
              leavePayCount: r['CT'] || "0", leavePayAmt: r['CU'] || "0.00",
              
              grossPay: r['CX'] || "0.00",

              // Deductions
              welfare: r['DA'] || "0.00",
              healthInsurance: r['DB'] || "0.00",
              insuranceCard: r['DC'] || "0.00",
              misc: r['DD'] || "0.00",
              medical: r['DE'] || "0.00",
              salaryLoan1: r['DF'] || "0.00",
              salaryLoan2: r['DG'] || "0.00",
              sssLoan: r['DH'] || "0.00",
              sssCalamityLoan: r['DI'] || "0.00",
              hdmfLoan: r['DJ'] || "0.00",
              hdmfCalamityLoan: r['DK'] || "0.00",
              totalDeduction: r['DO'] || "0.00",

              // Adjustments & Net Pay
              payrollAdj1: r['DP'] || "0.00",
              payrollAdj2: r['DQ'] || "0.00",
              salaryLoan3: r['DR'] || "0.00",
              refundSalary: r['DT'] || "0.00",
              netPay: r['DV'] || "0.00"
            };

            await db.collection("payslips").add(payslipData);
            count++;
          }

          // Register successful upload batch
          await db.collection("uploaded_payrolls").add({
            company: valA1,
            client: valA2,
            payrollDate: valA3,
            payrollPeriod: valA4,
            uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          showStatus(`✅ Successfully uploaded ${count} payslips for ${valA3}!`);
          fileInput.value = "";

        } catch (err) {
          console.error(err);
          showStatus("System Error reading Excel columns.", true);
        }
      };

      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
