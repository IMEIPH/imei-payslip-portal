<script>
/* Submit Registration Request */
async function submitRegistration() {
  const rawEmpId = document.getElementById("regEmpId").value.trim();
  
  /* 1. Remove dashes, spaces, special chars & convert to uppercase */
  const empId = rawEmpId.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();

  /* 2. Keep PIN strictly as a string */
  const pin = document.getElementById("regPin").value.trim();
  const pinConfirm = document.getElementById("regPinConfirm").value.trim();
  const statusDiv = document.getElementById("regStatus");

  statusDiv.innerHTML = "";

  /* 3. Check for empty inputs */
  if (!empId || !pin || !pinConfirm) {
    statusDiv.innerHTML = "<span style='color:red;'>PLEASE FILL IN ALL FIELDS.</span>";
    return;
  }

  /* 4. Exactly 6 digits check */
  const pinRegex = /^\d{6}$/;
  if (!pinRegex.test(pin)) {
    statusDiv.innerHTML = "<span style='color:red;'>PIN MUST BE EXACTLY 6 DIGITS (NUMBERS ONLY).</span>";
    return;
  }

  /* 5. Validate matching PINs */
  if (pin !== pinConfirm) {
    statusDiv.innerHTML = "<span style='color:red;'>PINS DO NOT MATCH. PLEASE TRY AGAIN.</span>";
    return;
  }

  try {
    statusDiv.innerHTML = "<span style='color:blue;'>Checking ID...</span>";

    /* 6. Check if normalized ID exists */
    const empDoc = await db.collection("employees").doc(empId).get();
    const reqDoc = await db.collection("registration_requests").doc(empId).get();

    if (empDoc.exists || reqDoc.exists) {
      alert("ID already exist");
      statusDiv.innerHTML = "<span style='color:red;'>ID ALREADY EXIST.</span>";
      return;
    }

    /* 7. Save to Firestore */
    await db.collection("registration_requests").doc(empId).set({
      empId: String(empId),
      pin: String(pin),
      status: "PENDING",
      requestedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    statusDiv.innerHTML = "<span style='color:green;'>REGISTRATION SUBMITTED! WAITING FOR ADMIN APPROVAL.</span>";
    
    setTimeout(() => {
      closeRegisterModal();
    }, 2000);

  } catch (err) {
    console.error(err);
    statusDiv.innerHTML = "<span style='color:red;'>ERROR: " + err.message + "</span>";
  }
}
</script>
